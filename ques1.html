<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
    }
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #1e293b;
      padding: 15px 0;
      text-align: center;
      z-index: 100;
    }
    header h1 { margin: 0; color: #38bdf8; }
    nav a {
      margin: 0 15px;
      color: #f1f5f9;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover { color: #38bdf8; }
    main {
      margin-top: 100px;
      text-align: center;
      padding: 40px 20px;
    }
    img {
      width: 180px;
      border-radius: 50%;
      margin-top: 20px;
    }
    footer {
      background: #1e293b;
      text-align: center;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Jivu Sorout</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>
  <main>
    <p>Hi, I'm Jivu Sorout — a passionate web developer who loves building interactive and user-friendly websites.</p>
    <img src="https://via.placeholder.com/180" alt="Profile Photo">
  </main>
  <footer>
    &copy; 2025 Jivu Sorout. All rights reserved.
  </footer>
</body>
</html>
