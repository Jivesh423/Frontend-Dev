<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Q1 — Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="q1-gallery.css" />
</head>
<body>
  <main class="gallery-page">
    <h1>Responsive Image Filter Gallery</h1>
    <section class="grid">
      <figure>
        <img src="https://via.placeholder.com/600x400?text=Blur" alt="Blur example" class="img blur">
        <figcaption>Blur</figcaption>
      </figure>
      <figure>
        <img src="https://via.placeholder.com/600x400?text=Grayscale" alt="Grayscale example" class="img grayscale">
        <figcaption>Grayscale</figcaption>
      </figure>
      <figure>
        <img src="https://via.placeholder.com/600x400?text=Sepia" alt="Sepia example" class="img sepia">
        <figcaption>Sepia</figcaption>
      </figure>
      <figure>
        <img src="https://via.placeholder.com/600x400?text=Brightness" alt="Brightness example" class="img bright">
        <figcaption>Brightness</figcaption>
      </figure>
      <figure>
        <img src="https://via.placeholder.com/600x400?text=Contrast" alt="Contrast example" class="img contrast">
        <figcaption>Contrast</figcaption>
      </figure>
      <figure>
        <img src="https://via.placeholder.com/600x400?text=Hue-rotate" alt="Hue rotate example" class="img hue">
        <figcaption>Hue-rotate</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
