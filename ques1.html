<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial;background:#f2f2f2;padding:20px;}
header{
  display:flex;justify-content:space-between;align-items:center;
  background:#fff;padding:15px 25px;border-radius:8px;
}
nav a{margin-left:15px;text-decoration:none;color:#333;}
main{
  display:flex;align-items:center;justify-content:center;
  gap:20px;margin:30px 0;
}
.about, .image{flex:1;}
.about{background:#fff;padding:20px;border-radius:8px;}
.image img{width:100%;border-radius:8px;}
footer{text-align:center;padding:10px;background:#fff;border-radius:8px;}
@media(max-width:700px){
  header, main{flex-direction:column;text-align:center;}
}
</style>
</head>
<body>
<header>
  <h2>Your Name</h2>
  <nav><a href="#">Home</a><a href="#">About</a><a href="#">Contact</a></nav>
</header>
<main>
  <section class="about">
    <h3>About Me</h3>
    <p>I’m a passionate web developer creating responsive designs using HTML, CSS, and JavaScript.</p>
  </section>
  <section class="image">
    <img src="https://via.placeholder.com/400" alt="Profile">
  </section>
</main>
<footer>&copy; 2025 Your Name</footer>
</body>
</html>
