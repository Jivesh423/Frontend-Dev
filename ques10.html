<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Layout</title>
<style>
body{font-family:sans-serif;background:#f2f2f2;padding:20px;}
header{
  display:flex;justify-content:space-between;align-items:center;
  background:#fff;padding:15px;border-radius:8px;
}
main{
  display:grid;grid-template-columns:2fr 1fr;gap:15px;margin-top:15px;
}
article{
  background:#fff;padding:15px;border-radius:8px;
  display:flex;flex-direction:column;gap:10px;
}
.row{display:flex;gap:10px;}
.row div{flex:1;background:#e0f2fe;padding:15px;border-radius:6px;}
aside{background:#fff;padding:15px;border-radius:8px;}
footer{text-align:center;margin-top:10px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
h2{animation:fadeIn 1s ease;}
@media(max-width:800px){
  main{grid-template-columns:1fr;}
  .row{flex-direction:column;}
}
</style>
</head>
<body>
<header>
  <h2>My Site</h2>
  <nav>Home | About | Contact</nav>
</header>
<main>
  <article>
    <h3>Article Title</h3>
    <div class="row">
      <div>Box 1</div>
      <div>Box 2</div>
      <div>Box 3</div>
    </div>
  </article>
  <aside>Sidebar Content</aside>
</main>
<footer>© 2025 Footer Text</footer>
</body>
</html>
