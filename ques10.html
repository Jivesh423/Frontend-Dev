<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Website Layout</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      background: #0f172a;
      color: white;
      padding: 15px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }
    .hero {
      background: url('https://via.placeholder.com/1200x400') center/cover no-repeat;
      color: white;
      height: 50vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    }
    .about {
      display: flex;
      padding: 40px;
      align-items: center;
      gap: 20px;
    }
    .about img {
      width: 40%;
      border-radius: 10px;
    }
    .services {
      display: flex;
      gap: 20px;
      padding: 40px;
      justify-content: center;
    }
    .service {
      background: rgba(56,189,248,0.1);
      border: 1px solid #38bdf8;
      padding: 20px;
      border-radius: 10px;
      width: 250px;
      text-align: center;
    }
    .contact {
      padding: 40px;
      background: #f1f5f9;
    }
    footer {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 15px;
    }
    @media (max-width: 768px) {
      .about { flex-direction: column; }
      .services { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    Welcome to My Website
  </section>

  <section class="about">
    <img src="https://via.placeholder.com/400x300" alt="About">
    <div>
      <h2>About Me</h2>
      <p>I am a web developer who creates responsive and visually balanced websites using HTML, CSS, and JavaScript.</p>
    </div>
  </section>

  <section class="services">
    <div class="service">Web Design</div>
    <div class="service">Frontend Development</div>
    <div class="service">UI/UX Optimization</div>
  </section>

  <section class="contact">
    <h2>Contact</h2>
    <form>
      <input type="text" placeholder="Your Name" style="padding:10px;width:100%;margin:5px 0;">
      <input type="email" placeholder="Your Email" style="padding:10px;width:100%;margin:5px 0;">
      <textarea placeholder="Your Message" style="padding:10px;width:100%;height:100px;margin:5px 0;"></textarea>
      <button style="padding:10px 20px;background:#0f172a;color:white;border:none;border-radius:5px;">Send</button>
    </form>
  </section>

  <footer>
    &copy; 2025 All Rights Reserved.
  </footer>
</body>
</html>
