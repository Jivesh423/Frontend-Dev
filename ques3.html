<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homepage</title>
<style>
body{font-family:sans-serif;background:#eef;padding:20px;}
header{display:flex;justify-content:space-around;background:#fff;padding:15px;border-radius:8px;}
main{display:flex;justify-content:center;gap:20px;margin:20px 0;}
.box{
  background:#fff;padding:40px;flex:1;text-align:center;
  border-radius:8px;transition:transform .3s;
}
.box:hover{transform:rotate(2deg);}
footer{text-align:center;background:#fff;padding:10px;border-radius:8px;}
@media(max-width:700px){main{flex-direction:column;}}
</style>
</head>
<body>
<header>
  <a href="#">Home</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</header>
<main>
  <div class="box">Services</div>
  <div class="box">Projects</div>
  <div class="box">Contact</div>
</main>
<footer>Footer © 2025</footer>
</body>
</html>
