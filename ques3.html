<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Team</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      text-align: center;
    }
    h1 {
      background: #0f172a;
      color: white;
      padding: 20px 0;
      margin: 0;
    }
    .team {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 50px;
    }
    .member {
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 15px;
      width: 300px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .member img {
      width: 100%;
      border-radius: 10px;
    }
    .member h2 { color: #0f172a; margin: 10px 0 5px; }
    .member p { color: #475569; margin: 0; }
  </style>
</head>
<body>
  <h1>Meet Our Team</h1>
  <div class="team">
    <div class="member">
      <img src="https://via.placeholder.com/300x200" alt="Member 1">
      <h2>Rahul Verma</h2>
      <p>Frontend Developer</p>
    </div>
    <div class="member">
      <img src="https://via.placeholder.com/300x200" alt="Member 2">
      <h2>Simran Kaur</h2>
      <p>UI/UX Designer</p>
    </div>
    <div class="member">
      <img src="https://via.placeholder.com/300x200" alt="Member 3">
      <h2>Arjun Mehta</h2>
      <p>Backend Engineer</p>
    </div>
  </div>
</body>
</html>
