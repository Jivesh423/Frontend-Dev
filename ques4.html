<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
body{font-family:sans-serif;background:#f3f4f6;padding:20px;}
.dashboard{
  display:grid;
  grid-template-columns:200px 1fr 1fr;
  grid-template-rows:auto 1fr;
  gap:15px;
}
header{grid-column:1/4;background:#2563eb;color:#fff;padding:15px;border-radius:8px;}
.sidebar{background:#fff;padding:15px;border-radius:8px;}
.content{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.box{
  background:#fff;border-radius:8px;padding:20px;
  transition:transform .3s,box-shadow .3s;
}
.box:hover{transform:scale(1.05);box-shadow:0 5px 15px rgba(0,0,0,0.2);}
.big{grid-column:span 2;}
@media(max-width:800px){
  .dashboard{grid-template-columns:1fr;}
  .content{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="dashboard">
  <header>Dashboard Header</header>
  <aside class="sidebar">Sidebar Navigation</aside>
  <section class="content">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box big">Wide Box</div>
    <div class="box">Box 4</div>
  </section>
</div>
</body>
</html>
