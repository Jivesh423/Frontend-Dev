<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Q5 — Filter Cards with Animation</title>
  <link rel="stylesheet" href="q5-filter-cards.css" />
</head>
<body>
  <main class="profiles">
    <h1>Profile Cards</h1>
    <section class="card-row">
      <div class="profile card">
        <img src="https://via.placeholder.com/240x240?text=User+1" alt="User 1" class="profile-img grayscale">
        <div class="info"><h3>Alice</h3><p>Designer</p></div>
      </div>
      <div class="profile card">
        <img src="https://via.placeholder.com/240x240?text=User+2" alt="User 2" class="profile-img sepia">
        <div class="info"><h3>Ben</h3><p>Developer</p></div>
      </div>
      <div class="profile card">
        <img src="https://via.placeholder.com/240x240?text=User+3" alt="User 3" class="profile-img contrast">
        <div class="info"><h3>Cara</h3><p>Product</p></div>
      </div>
    </section>
  </main>
</body>
</html>
