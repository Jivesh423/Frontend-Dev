<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Layout</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    header {
      background: #0f172a;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
    }
    .left, .right {
      flex: 1;
      padding: 40px;
    }
    .left {
      background: #38bdf8;
      color: white;
    }
    .right {
      background: #f1f5f9;
      color: #0f172a;
    }
    @media (max-width: 768px) {
      .container { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Responsive Two-Column Layout</h1>
  </header>
  <div class="container">
    <div class="left">
      <h2>Left Column</h2>
      <p>This section contains main content with a colorful background.</p>
    </div>
    <div class="right">
      <h2>Right Column</h2>
      <p>This section adjusts below the left column on smaller screens.</p>
    </div>
  </div>
</body>
</html>
