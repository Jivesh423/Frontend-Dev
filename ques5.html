<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing</title>
<style>
body{font-family:sans-serif;background:#f3f3f3;padding:20px;}
.pricing{display:flex;gap:15px;justify-content:center;}
.card{
  flex:1;background:#fff;padding:20px;text-align:center;
  border-radius:10px;transition:transform .3s;
  animation:fade .7s ease forwards;
}
.card:hover{transform:translateY(-10px);}
.card.featured{background:#0077b6;color:#fff;transform:scale(1.05);}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@media(max-width:750px){.pricing{flex-direction:column;}}
</style>
</head>
<body>
<h2>Pricing Plans</h2>
<div class="pricing">
  <div class="card">Basic<br>$9/mo</div>
  <div class="card featured">Pro<br>$29/mo</div>
  <div class="card">Enterprise<br>$99/mo</div>
</div>
</body>
</html>
