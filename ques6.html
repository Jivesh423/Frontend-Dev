<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Layout</title>
<style>
body{font-family:sans-serif;background:#eef2ff;padding:20px;}
.container{
  display:grid;
  grid-template-areas:
    'header header'
    'sidebar main'
    'footer footer';
  grid-template-columns:250px 1fr;
  gap:15px;
}
header{grid-area:header;background:#fff;padding:10px;border-radius:8px;}
.sidebar{grid-area:sidebar;background:#fff;padding:10px;border-radius:8px;}
.main{grid-area:main;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
footer{grid-area:footer;text-align:center;background:#fff;padding:10px;border-radius:8px;}
.post{background:#fff;border-radius:8px;padding:15px;}
@media(max-width:800px){
  .container{grid-template-areas:'header' 'main' 'sidebar' 'footer';grid-template-columns:1fr;}
  .main{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="container">
  <header><h2>My Blog</h2></header>
  <aside class="sidebar"><h3>Categories</h3></aside>
  <main class="main">
    <div class="post">Post 1</div>
    <div class="post">Post 2</div>
  </main>
  <footer>Contact Info</footer>
</div>
</body>
</html>
