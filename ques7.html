<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Animation</title>
<style>
body{display:flex;align-items:center;justify-content:center;height:100vh;background:#f9fafb;}
.loader{display:flex;gap:10px;}
.dot{
  width:15px;height:15px;border-radius:50%;background:#0077b6;
  animation:bounce .8s infinite ease-in-out;
}
.dot:nth-child(2){animation-delay:0.1s;}
.dot:nth-child(3){animation-delay:0.2s;}
@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
}
</style>
</head>
<body>
<div class="loader">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>
</body>
</html>
