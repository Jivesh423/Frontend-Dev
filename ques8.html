<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #0f172a;
      color: white;
      padding: 15px;
      text-align: center;
      z-index: 10;
    }
    .container {
      display: flex;
      margin-top: 60px;
      width: 100%;
    }
    .sidebar {
      background: #1e293b;
      color: white;
      width: 220px;
      padding: 20px;
      height: calc(100vh - 60px);
    }
    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 15px 0;
    }
    .main {
      flex: 1;
      background: #f1f5f9;
      padding: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .box {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      flex: 1 1 45%;
      padding: 20px;
      min-height: 150px;
    }
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .sidebar { width: 100%; height: auto; }
    }
  </style>
</head>
<body>
  <header>Dashboard Header</header>
  <div class="container">
    <div class="sidebar">
      <h3>Navigation</h3>
      <a href="#">Overview</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
    </div>
    <div class="main">
      <div class="box">Content Box 1</div>
      <div class="box">Content Box 2</div>
    </div>
  </div>
</body>
</html>
