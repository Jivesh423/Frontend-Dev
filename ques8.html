<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>
<style>
body{font-family:sans-serif;background:#f3f3f3;padding:20px;}
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}
figure{overflow:hidden;border-radius:8px;background:#fff;}
img{width:100%;height:200px;object-fit:cover;transition:transform .5s ease;}
figure:hover img{transform:scale(1.05);}
figcaption{text-align:center;padding:8px;}
</style>
</head>
<body>
<h2>Photo Gallery</h2>
<div class="gallery">
  <figure><img src="https://via.placeholder.com/400" alt=""><figcaption>Caption 1</figcaption></figure>
  <figure><img src="https://via.placeholder.com/401" alt=""><figcaption>Caption 2</figcaption></figure>
  <figure><img src="https://via.placeholder.com/402" alt=""><figcaption>Caption 3</figcaption></figure>
  <figure><img src="https://via.placeholder.com/403" alt=""><figcaption>Caption 4</figcaption></figure>
</div>
</body>
</html>
