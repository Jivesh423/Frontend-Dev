<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Flip</title>
<style>
body{display:flex;align-items:center;justify-content:center;height:100vh;background:#e0f7fa;}
.container{perspective:1000px;}
.card{
  width:250px;height:160px;position:relative;
  transform-style:preserve-3d;transition:transform .7s;
}
.card:hover{transform:rotateY(180deg);}
.side{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  border-radius:10px;backface-visibility:hidden;font-size:18px;
}
.front{background:#fff;}
.back{background:#0077b6;color:#fff;transform:rotateY(180deg);}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="side front">Front Side</div>
    <div class="side back">Back Description</div>
  </div>
</div>
</body>
</html>
