<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Q9 — Responsive Principles</title>
  <link rel="stylesheet" href="q9-principles.css" />
</head>
<body>
  <main class="principles">
    <h1>Responsive Design Principles</h1>
    <section class="grid">
      <article class="principle">
        <h2>Fluid Layouts</h2>
        <pre><code>width:100%;max-width:1200px;</code></pre>
        <p>Use percentages and min/max to flow with viewport.</p>
      </article>

      <article class="principle">
        <h2>Flexible Media</h2>
        <pre><code>img{max-width:100%;height:auto}</code></pre>
        <p>Media scales to container size.</p>
      </article>

      <article class="principle">
        <h2>Breakpoints</h2>
        <pre><code>@media (max-width:600px) { ... }</code></pre>
        <p>Define when layout should adapt.</p>
      </article>
    </section>
  </main>
</body>
</html>
